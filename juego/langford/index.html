<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Solitario de Langford · El problema del día</title>
<meta name="description" content="Dos cartas de cada valor, una fila de huecos y una sola regla: entre las dos cartas de valor k tiene que haber exactamente k cartas. ¿Puedes colocarlas todas?">
<link rel="stylesheet" href="../_engine/style.css">
<style>
  .lg-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
  .lg-ctrl button,.lg-ctrl select{min-height:44px}
  .lg-ctrl select{max-width:100%}
  .lg-ctrl button:focus-visible,.lg-ctrl select:focus-visible,.lg-opt input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
  .lg-opt{display:inline-flex;align-items:center;gap:6px;min-height:44px;font-size:.92rem;color:var(--muted);cursor:pointer}
  .lg-opt input{width:20px;height:20px;margin:0}
  .lg-datos{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:.9rem;color:var(--muted);margin:0 0 6px}
  .lg-datos b{color:var(--ink);font-variant-numeric:tabular-nums}
  .lg-msg{min-height:3.2em;font-size:1.04rem;margin:0 0 8px}
  .lg-msg.ok{color:var(--verde)} .lg-msg.bad{color:var(--rojo)}
  .lg-fila{display:grid;grid-template-columns:repeat(var(--cols),minmax(0,1fr));gap:5px;max-width:560px;margin:6px auto 0}
  .lg-slot{position:relative;aspect-ratio:5/7;min-width:0;padding:0;margin:0;display:flex;align-items:center;justify-content:center;
    border:2px dashed var(--line);border-radius:10px;background:transparent;color:var(--muted);cursor:pointer;touch-action:none;
    font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,5.4vw,1.9rem);line-height:1}
  .lg-slot .lg-i{position:absolute;top:2px;left:4px;font-size:.62rem;font-weight:400;font-family:var(--body);color:var(--muted)}
  .lg-slot.lleno{background:#fffdf7;color:#2b2620;border:2.5px solid var(--line);box-shadow:0 2px 5px rgba(60,45,20,.18)}
  .lg-slot.lleno .lg-i{color:#857c6e}
  .lg-slot:focus-visible{outline:3px solid var(--accent);outline-offset:2px;z-index:2}
  .lg-slot.ok{border-color:var(--verde);box-shadow:0 0 0 2px var(--verde) inset,0 2px 5px rgba(60,45,20,.18)}
  .lg-slot.bad{border-color:var(--rojo);box-shadow:0 0 0 2px var(--rojo) inset,0 2px 5px rgba(60,45,20,.18)}
  .lg-slot.legal{border:2.5px solid var(--azul);background:color-mix(in srgb,var(--azul) 12%,transparent)}
  .lg-slot.pista{animation:lg-pulso 1.1s ease-in-out infinite;border-color:var(--accent);border-style:solid}
  .lg-slot.pista.quitar{border-color:var(--rojo)}
  @keyframes lg-pulso{0%,100%{box-shadow:0 0 0 0 transparent}50%{box-shadow:0 0 0 5px color-mix(in srgb,var(--accent) 45%,transparent)}}
  .lg-mano{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:560px;margin:14px auto 4px;padding:10px;border:1.5px dashed var(--line);border-radius:14px;min-height:92px}
  .lg-val{position:relative;width:52px;height:72px;padding:0;margin:0;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--line);border-radius:10px;
    background:#fffdf7;color:#2b2620;cursor:pointer;touch-action:none;font-family:var(--display);font-weight:700;font-size:1.7rem;line-height:1;box-shadow:0 2px 5px rgba(60,45,20,.18)}
  .lg-val .lg-q{position:absolute;bottom:-9px;right:-7px;min-width:22px;height:22px;border-radius:11px;background:var(--accent);color:#fff;font-family:var(--body);font-size:.8rem;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
  .lg-val.sel{border-color:var(--azul);box-shadow:0 0 0 3px var(--azul),0 2px 5px rgba(60,45,20,.18);transform:translateY(-4px)}
  .lg-val.pista{animation:lg-pulso 1.1s ease-in-out infinite;border-color:var(--accent)}
  .lg-val:disabled{opacity:.28;cursor:default;box-shadow:none}
  .lg-val:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
  .lg-vacia{width:100%;text-align:center;color:var(--muted);font-size:.9rem;align-self:center}
  .lg-ghost{position:fixed;left:0;top:0;z-index:50;pointer-events:none;width:48px;height:66px;display:flex;align-items:center;justify-content:center;border:2.5px solid var(--azul);border-radius:10px;background:#fffdf7;color:#2b2620;
    font-family:var(--display);font-weight:700;font-size:1.6rem;box-shadow:0 8px 18px rgba(0,0,0,.3)}
  .lg-ctrl2{margin-top:12px}
  .lg-info{margin-top:14px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--bg);font-size:.93rem}
  .lg-info p{margin:.3em 0}
  .lg-info .lg-found{font-variant-numeric:tabular-nums;color:var(--muted);word-break:break-word}
  .lg-intro{font-size:.93rem;color:var(--muted);margin:0 0 8px}
  .lg-intro b{color:var(--ink)}
  /* tapete verde, fila de conjunto y cinta movible (7 y 8 parejas) */
  .lg-tapete{background:#2f6f4e;border-radius:16px;padding:10px 8px 12px;margin-top:6px;box-shadow:inset 0 0 28px rgba(0,0,0,.30)}
  @media(prefers-color-scheme:dark){.lg-tapete{background:#25533b}}
  .lg-tapete .lg-fila,.lg-tapete .lg-cinta{margin-top:0}
  .lg-tapete .lg-slot:not(.lleno){border-color:rgba(255,255,255,.55);color:#e7f3ea}
  .lg-tapete .lg-slot:not(.lleno) .lg-i{color:#d7ebdd}
  .lg-tapete .lg-slot.legal{border:2.5px solid #8fd0ff;background:rgba(143,208,255,.30)}
  .lg-tapete .lg-slot.pista{border-color:#ffd166;border-style:solid}
  .lg-tapete .lg-slot.pista.quitar{border-color:#ff8a7a}
  .lg-tapete .lg-mano{border-color:rgba(255,255,255,.45);margin-top:10px}
  .lg-tapete .lg-vacia{color:#e7f3ea}
  .lg-slot.ok::after,.lg-slot.bad::after{position:absolute;bottom:2px;right:2px;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:var(--body);font-size:.7rem;font-weight:700;color:#fff}
  .lg-slot.ok::after{content:"✓";background:#1d8a4b} .lg-slot.bad::after{content:"✕";background:#c0432f}
  .lg-resumen{position:relative;display:flex;gap:2px;max-width:560px;margin:0 auto 10px;padding:4px 2px;cursor:pointer}
  .lg-resumen[hidden]{display:none}
  .lg-mini{flex:1 1 0;min-width:0;aspect-ratio:5/7;display:flex;align-items:center;justify-content:center;border:1.5px dashed rgba(255,255,255,.5);border-radius:4px;
    font-family:var(--display);font-weight:700;font-size:.66rem;line-height:1;color:#2b2620}
  .lg-mini.lleno{background:#fffdf7;border:1.5px solid #d8cfba}
  .lg-mini.ok{border-color:#3ddc84;box-shadow:0 0 0 1.5px #3ddc84}
  .lg-mini.bad{border-color:#ff6b5a;box-shadow:0 0 0 1.5px #ff6b5a}
  .lg-mini.legal{background:rgba(143,208,255,.55);border:1.5px solid #8fd0ff}
  .lg-mini.pista{border:1.5px solid #ffd166;box-shadow:0 0 0 1.5px #ffd166}
  .lg-ventana{position:absolute;top:0;bottom:0;border:2px solid #ffd166;border-radius:5px;pointer-events:none;box-shadow:0 0 0 1px rgba(0,0,0,.25)}
  .lg-cinta{display:flex;gap:4px;overflow-x:auto;scroll-snap-type:x mandatory;max-width:560px;margin:0 auto;padding:4px 2px 8px;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.6) transparent}
  .lg-cinta .lg-slot{flex:0 0 calc((100% - (var(--vis) - 1) * 4px) / var(--vis));scroll-snap-align:start;touch-action:pan-x}
  @media(prefers-reduced-motion:reduce){.lg-slot.pista,.lg-val.pista{animation:none}}
  @media(max-width:420px){.lg-ctrl button,.lg-ctrl select{flex:1 1 auto}.lg-val{width:46px;height:64px;font-size:1.5rem}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module" src="main.js"></script>
</body>
</html>
